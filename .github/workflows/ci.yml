name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-Only!Approval2026
        ports: ["1433:1433"]
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Only!Approval2026' -C -Q 'SELECT 1' -b"
          --health-interval=10s --health-timeout=5s --health-retries=20 --health-start-period=30s
    env:
      TEST_DATABASE: Server=localhost,1433;User Id=sa;Password=Ci-Only!Approval2026;TrustServerCertificate=True
      VERIFY_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: sh scripts/verify-dotnet.sh
      - run: python3 scripts/check-audit.py "evidence/runs/$VERIFY_RUN_ID/dependency-audit.json"
      - run: node --test --test-reporter=tap tests/frontend/review.test.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification
          path: |
            evidence/runs/
